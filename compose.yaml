services:
  postgres17:
    image: postgres:18.4-alpine3.24
    container_name: postgres17
    environment:
      POSTGRES_DB: tenant_db
      POSTGRES_USER: yu71
      POSTGRES_PASSWORD: 53cret
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images use PGDATA=/var/lib/postgresql/18/docker, so the
      # persistent mount point is /var/lib/postgresql (not .../data).
      - ./postgres17_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yu71 -d tenant_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.4.0
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres17:
        condition: service_healthy

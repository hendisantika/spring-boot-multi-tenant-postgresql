services:
  postgres18:
    image: postgres:18.4-alpine3.24
    container_name: postgres18
    environment:
      POSTGRES_DB: tenant_db
      POSTGRES_USER: yu71
      POSTGRES_PASSWORD: 53cret
    ports:
      # Host port is overridable because 5432/5433 are commonly already taken.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      # Postgres 18 images use PGDATA=/var/lib/postgresql/18/docker, so the
      # persistent mount point is /var/lib/postgresql (not .../data).
      - ./postgres18_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yu71 -d tenant_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Behind a profile on purpose. Running the app locally starts this compose file
  # (spring.docker.compose.*), so an always-on app service would boot a second
  # copy of the app and collide on 8080. Start it with:
  #   docker compose --profile app up -d --build
  app:
    profiles: [ "app" ]
    build:
      context: .
    container_name: multitenant-app
    environment:
      # Inside the network Postgres is reached on its container port, not the
      # published one.
      DB_HOST: postgres18
      DB_PORT: 5432
      DB_NAME: tenant_db
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres18:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.4.0
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT:-5052}:80"
    depends_on:
      postgres18:
        condition: service_healthy

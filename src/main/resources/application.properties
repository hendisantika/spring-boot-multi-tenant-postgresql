spring.application.name=multitenant-demo5
server.port=8080
###database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:tenant_db}
spring.datasource.username=yu71
spring.datasource.password=53cret
spring.datasource.driver-class-name=org.postgresql.Driver
#Multitenancy - Hibernate 6+ infers schema multi-tenancy from the
#MultiTenantConnectionProvider bean, so hibernate.multiTenancy is no longer set here.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#Flyway - migrations are applied per tenant schema by TenantSchemaMigrator,
#so Boot's single-schema auto-configuration is switched off.
spring.flyway.enabled=false
#Paging - default page size for /customers, and a ceiling so a caller
#cannot ask for the whole table with ?size=100000 (Spring's default cap is 2000).
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
#Actuator - only the health endpoint is exposed, and it reports status without
#details so it is safe for an unauthenticated container probe to hit.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start_and_stop
